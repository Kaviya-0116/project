<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <script>
        function show() {
            var cname = document.getElementById("city").value.trim();

            if(cname === ""){
                document.getElementById("res").innerHTML = "";
                document.getElementById("res7").innerHTML = "❌ Please enter a city name";
                return;
            }

            var api =` https://api.openweathermap.org/data/2.5/weather?q=${cname}&appid=9a5a0b9eee3804f50d7050495c78a1cc&units=metric`;

            fetch(api)
            .then((response) => {
                if (!response.ok) {
                    throw new Error("City Not Found");
                }
                return response.json();
            })
            .then((data) => {

                document.getElementById("res7").innerHTML = ""; // clear error

                // 👉 Show weather details only when city exists
                document.getElementById("res").innerHTML = `
                    <h3>${data.name} Weather</h3>
                    🌡 Temperature: ${data.main.temp}°C <br>
                    🌥 Condition: ${data.weather[0].description} <br>
                    💨 Wind: ${data.wind.speed} m/s <br>
                    🌡 Feels Like: ${data.main.feels_like}°C
                `;
            })
            .catch(() => {
                // 👉 Wrong city name → Only error message
                document.getElementById("res").innerHTML = "";
                document.getElementById("res7").innerHTML = "❌ City Not Found";
            });
        }
    </script>
</head>
<body>

    <input type="text" id="city" placeholder="Enter City Name">
    <button onclick="show()">Search</button>

    <div id="res" style="margin-top:20px; font-size:18px;"></div>
    <div id="res7" style="color:red; font-weight:bold; margin-top:10px;"></div>

</body>
</html>
